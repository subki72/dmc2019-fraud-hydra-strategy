name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: ruff check src tests

      - name: Run Ruff Format Verification
        run: ruff format --check src tests

      - name: Run Mypy Static Type Checking
        run: mypy src

  test-matrix:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage Gate (>=80%)
        run: python -m pytest --cov=dmc_fraud --cov-report=term-missing --cov-fail-under=80

  build-distribution:
    name: Build Wheel & Sdist
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip build

      - name: Build Source and Binary Distributions
        run: python -m build

      - name: Verify Distribution Artifacts
        run: ls -la dist/

  security-scan:
    name: Security Scan (SAST & Container)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Docker Image for Scan
        run: docker build -t dmc2019-fraud-hydra:ci .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dmc2019-fraud-hydra:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

